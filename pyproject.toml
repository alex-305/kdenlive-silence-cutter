[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdenlive-silence-cutter"
version = "0.1.0"
description = "Non-destructive silence removal for Kdenlive projects"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8"]

[project.scripts]
kdenlive-silence-cutter = "silence_cutter.cli:main"
kdenlive-silence-cutter-gui = "silence_cutter.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
